name: DAST - Backend API

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: dast-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-api-scan:
    name: OWASP ZAP API scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test backend
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Start disposable H2 backend
        shell: bash
        env:
          SPRING_PROFILES_ACTIVE: h2
          SERVER_ADDRESS: 127.0.0.1
          SERVER_PORT: "8080"
          SUPABASE_AUTH_ISSUER: ""
        run: |
          java -jar target/project-0.0.1-SNAPSHOT.jar > backend-dast.log 2>&1 &
          echo $! > backend-dast.pid

          ready=false
          for attempt in {1..60}; do
            if curl --silent --show-error --fail http://127.0.0.1:8080/api/v1/categories > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$(cat backend-dast.pid)" 2>/dev/null; then
              cat backend-dast.log
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            cat backend-dast.log
            exit 1
          fi

      # The OpenAPI file contains only public, read-only routes. The active scan
      # therefore attacks an ephemeral H2 instance and never Supabase/production.
      - name: Scan public API with OWASP ZAP
        uses: zaproxy/action-api-scan@bd24b11e76da11ab60302c8ae87f091cbb11f034 # v0.10.0
        with:
          target: .zap/openapi-public.yaml
          format: openapi
          rules_file_name: .zap/backend-rules.tsv
          cmd_options: "-I -T 10"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-backend-api-report

      - name: Upload backend log when startup or scan fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-dast-log
          path: backend-dast.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop disposable backend
        if: always()
        shell: bash
        run: |
          if [ -f backend-dast.pid ]; then
            kill "$(cat backend-dast.pid)" 2>/dev/null || true
          fi
