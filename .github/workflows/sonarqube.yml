name: SAST - SonarQube

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Build, test and analyze
    # GitHub does not expose repository secrets to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate SonarQube configuration
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing repository secret SONAR_TOKEN."
            exit 1
          fi
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "::error::Missing repository variable SONAR_PROJECT_KEY."
            exit 1
          fi
          if [ "$SONAR_HOST_URL" = "https://sonarcloud.io" ] && [ -z "$SONAR_ORGANIZATION" ]; then
            echo "::error::Missing repository variable SONAR_ORGANIZATION for SonarQube Cloud."
            exit 1
          fi

      - name: Build, test and run SonarQube analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          sonar_args=(
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY"
            "-Dsonar.host.url=$SONAR_HOST_URL"
            "-Dsonar.qualitygate.wait=true"
            "-Dsonar.qualitygate.timeout=300"
          )

          if [ -n "$SONAR_ORGANIZATION" ]; then
            sonar_args+=("-Dsonar.organization=$SONAR_ORGANIZATION")
          fi

          mvn --batch-mode --no-transfer-progress clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            "${sonar_args[@]}"
