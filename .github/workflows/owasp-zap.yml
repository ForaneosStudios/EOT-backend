name: OWASP ZAP Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'

jobs:
  zap-scan:
    name: Dynamic Security Testing (DAST)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Start Spring Boot app in background
        run: |
          nohup java -jar target/*.jar --spring.profiles.active=test > app.log 2>&1 &
          echo "Esperando a que la API inicie..."
          sleep 25

      - name: Get Runner IP
        id: ip
        run: echo "HOST_IP=$(hostname -I | awk '{print $1}')" >> $GITHUB_ENV

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://${{ env.HOST_IP }}:8080'
          cmd_options: '-a'
          allow_issue_writing: false
