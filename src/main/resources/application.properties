spring.application.name=project

spring.jpa.defer-datasource-initialization=true

# ==============================================================================
# BASE DE DATOS H2 EN MEMORIA (MODO POSTGRESQL PARA DESARROLLO Y PRUEBAS)
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL: crea las tablas basadas en tus @Entity
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ejecutar data.sql después de que Hibernate termine de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Consola Web H2 (Acceso desde el navegador: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
