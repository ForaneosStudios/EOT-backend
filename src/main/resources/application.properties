spring.config.import=optional:file:.env.supabase.local[.properties]

# Remote settings can come from environment variables or the ignored local file.
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USER:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Render injects PORT; 8080 remains the local development fallback.
server.port=${PORT:8080}
server.address=0.0.0.0

# Keep operational endpoints minimal and safe for public health checks.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# Password recovery: link base URL (PWA) and SMTP. SMTP stays off until MAIL_HOST is set.
app.frontend-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:no-reply@eot.local}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# Behind Render's proxy: use X-Forwarded-For so rate limits see the real client address.
server.forward-headers-strategy=framework

# Optional: send through Brevo's HTTPS API instead of SMTP (hosts that block SMTP ports).
app.mail.brevo-api-key=${BREVO_API_KEY:}

# Every log line carries the id of the request being served (same id as the access log and error bodies).
logging.pattern.level=%5p [req=%X{requestId:-}]
logging.level.eot.http=INFO
