spring.config.import=optional:file:.env.supabase.local[.properties]

# Remote settings can come from environment variables or the ignored local file.
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USER:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Render injects PORT; 8080 remains the local development fallback.
server.port=${PORT:8080}
server.address=0.0.0.0

# Keep operational endpoints minimal and safe for public health checks.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false
