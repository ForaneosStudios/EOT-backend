# Perfil local PostgreSQL (servicio definido en docker-compose.yml).
# El datasource se declara en LocalPostgresDataSourceConfig para aislarlo de
# propiedades globales de entornos remotos.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
# Se pueden sobrescribir con EOT_DB_URL, EOT_DB_USER y EOT_DB_PASSWORD.
spring.datasource.url=${EOT_DB_URL:jdbc:postgresql://localhost:5433/eot}
spring.datasource.username=${EOT_DB_USER:eot}
spring.datasource.password=${EOT_DB_PASSWORD:eot_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver
# Asegura las credenciales del pool local aun si existen variables globales de Spring.
spring.datasource.hikari.username=eot
spring.datasource.hikari.password=eot_dev_password

# Docker crea el esquema y los datos de ejemplo al inicializar el volumen.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
