# Supabase CLI local stack (not the standalone docker-compose PostgreSQL).
spring.datasource.url=${SUPABASE_LOCAL_DB_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
spring.datasource.username=${SUPABASE_LOCAL_DB_USER:postgres}
spring.datasource.password=${SUPABASE_LOCAL_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=never

SUPABASE_AUTH_ISSUER=${SUPABASE_LOCAL_AUTH_ISSUER:http://127.0.0.1:54321/auth/v1}
